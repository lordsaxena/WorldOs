name: Deploy WORLDOS to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "WORLDOS/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WORLDOS/package-lock.json

      - name: Install dependencies
        working-directory: WORLDOS
        run: npm ci

      - name: Build app
        working-directory: WORLDOS
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: WORLDOS/dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
