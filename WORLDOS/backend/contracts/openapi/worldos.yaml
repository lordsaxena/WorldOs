openapi: 3.1.0
info:
  title: WorldOS API
  version: 1.0.0
  description: Health and runtime status for the WorldOS Python API.
servers:
  - url: http://localhost:8000
paths:
  /:
    get:
      summary: Get service information
      responses:
        "200":
          description: Service information and API docs location
          content:
            application/json:
              schema:
                type: object
                required: [name, status, docs]
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    const: online
                  docs:
                    type: string
  /health:
    get:
      summary: Check process liveness
      responses:
        "200":
          description: Python API process is responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      summary: Check startup readiness
      responses:
        "200":
          description: Service startup has completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service startup has not completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/system/status:
    get:
      summary: Get authoritative Python API runtime status
      responses:
        "200":
          description: Current API process status and runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
  /api/v1/auth/register:
    post:
      summary: Create an account and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Account profile and HttpOnly session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "409":
          description: Account email is already registered
        "422":
          description: Invalid registration details
  /api/v1/auth/login:
    post:
      summary: Sign in and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Account profile and HttpOnly session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Invalid email or password
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked and cookie cleared
  /api/v1/auth/me:
    get:
      summary: Get the current account profile
      responses:
        "200":
          description: Authenticated account profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
    put:
      summary: Update private profile and location details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: healthy
        service:
          type: string
    ReadinessResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
    ComponentStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, starting]
    RegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        city_name:
          type: [string, "null"]
          maxLength: 120
        state_region:
          type: [string, "null"]
          maxLength: 120
        country:
          type: [string, "null"]
          maxLength: 120
        location_description:
          type: [string, "null"]
          maxLength: 500
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 128
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        city_name:
          type: [string, "null"]
          maxLength: 120
        state_region:
          type: [string, "null"]
          maxLength: 120
        country:
          type: [string, "null"]
          maxLength: 120
        location_description:
          type: [string, "null"]
          maxLength: 500
    UserProfile:
      type: object
      required: [id, email, city_name, state_region, country, location_description, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        city_name:
          type: [string, "null"]
        state_region:
          type: [string, "null"]
        country:
          type: [string, "null"]
        location_description:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    RuntimeInfo:
      type: object
      required: [python_version, environment]
      properties:
        python_version:
          type: string
        environment:
          type: string
    SystemStatusResponse:
      type: object
      required: [service, version, status, started_at, uptime_seconds, runtime, components]
      properties:
        service:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [healthy, starting]
        started_at:
          type: [string, "null"]
          format: date-time
        uptime_seconds:
          type: number
          minimum: 0
        runtime:
          $ref: "#/components/schemas/RuntimeInfo"
        components:
          type: object
          required: [python_api, postgresql]
          properties:
            python_api:
              $ref: "#/components/schemas/ComponentStatus"
            postgresql:
              $ref: "#/components/schemas/ComponentStatus"